name: 刷步数

permissions:
  contents: write

on:
  schedule:
    - cron: '4 0,2,4,6,8,14 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.PAT }} #此处PAT需要申请，教程详见：README
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
          
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"
          
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py

      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add .
          # 核心修复：判断是否存在文件改动，无改动直接跳过提交
          CHANGES=$(git status --porcelain)
          if [ -n "$CHANGES" ]; then
            git commit -m "persist tokens trigger by ${{ github.event_name }}"
            git push origin master
          else
            echo "无文件变更，跳过commit与push，任务正常结束"
          fi
